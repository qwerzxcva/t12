# 每日同步 港股/美股/ETF 最新K线(增量30天) → 追加合并
# 09:00 CST = 01:00 UTC (美股收盘后/港股盘前); ~3min/run ≈ 66min/月
name: etf-daily
on:
  schedule:
    - cron: '0 1 * * 2-6'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync latest klines
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, time, re
          def fetch30(code):
              u = f"https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param={code},day,,,{40},qfq"
              d = json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"Referer":"https://gu.qq.com"}), timeout=20))
              data = d.get("data", {}).get(code, {})
              return data.get("qfqday") or data.get("day") or []
          for fname in ["data/kline_etf.csv", "data/kline_us.csv", "data/kline_etf.csv"]:
              try:
                  lines = open(fname).read().splitlines()
                  codes, out, cur = [], [], None
                  for l in lines:
                      if l.startswith("#"):
                          cur = l[1:].strip()
                          codes.append(cur)
                      out.append(l)
                  # 对每只票拉近40根, 若最新日期比文件里新则追加
                  added = 0
                  newlines = []
                  have = {}
                  cur = None
                  for l in lines:
                      if l.startswith("#"):
                          cur = l[1:].strip()
                          newlines.append(l)
                          continue
                      p = l.split("|")
                      if len(p) > 1:
                          have.setdefault(cur, set()).add(p[1])
                      newlines.append(l)
                  for c in codes:
                      try:
                          for row in fetch30(c):
                              if row[0] not in have.get(c, set()):
                                  newlines.append("|".join(map(str, [c]+row)))
                                  added += 1
                      except Exception:
                          pass
                      time.sleep(0.5)
                  open(fname, "w").write("
".join(newlines) + "
")
                  print(f"{fname}: +{added} rows")
              except Exception as e:
                  print(fname, "err:", e)
          PYEOF
      - name: Commit
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/
          git commit -m "sync: $(date +%F) etf klines" || echo "no change"
          git push
